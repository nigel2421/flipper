name: Django FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r wemisico/businessmatters.co.ke/ela_flipbook_django/flipbook_project/requirements.txt

    - name: Collect static files
      working-directory: wemisico/businessmatters.co.ke/ela_flipbook_django/flipbook_project
      run: python manage.py collectstatic --noinput
      env:
        DJANGO_SETTINGS_MODULE: flipbook_project.settings

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftp.wemisi.com
        username: flipper@businessmatters.co.ke
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: wemisico/businessmatters.co.ke/ela_flipbook_django/flipbook_project/
        server-dir: /wemisico/businessmatters.co.ke/ela_flipbook_django/flipbook_project/
        exclude: |
          **/.venv/**
          **/__pycache__/**
          **/*.pyc
          **/*.pyo
          **/.git/**
          **/node_modules/**
          **/db.sqlite3