name: Django FTP Deploy

on:
  push:
    branches:
      - main  # or your deployment branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Use a supported version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ela_flipbook_django/requirements.txt

    - name: Run tests (optional)
      run: |
        cd ela_flipbook_django
        python manage.py test

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ela_flipbook_django/  # Adjust if needed
        server-dir: /wemisico/businessmatters.co.ke/ela_flipbook_django  # Adjust to your cPanel path