<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #ef4444; }
        .content { padding: 30px 20px; background-color: #fef2f2; border-radius: 8px; margin-top: 20px; }
        .alert-heading { color: #b91c1c; font-weight: bold; font-size: 1.25rem; margin-bottom: 1rem; }
        .btn { display: inline-block; background-color: #b91c1c; color: white !important; padding: 14px 28px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
        .footer { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="color: #ef4444; margin: 0;">Security Alert</h1>
        </div>
        
        <div class="content">
            <div class="alert-heading">High Priority Security Notification</div>
            <p>{{ alert_message }}</p>
            <p><strong>Timestamp:</strong> {{ timestamp|date:"Y-m-d H:i:s" }} UTC</p>
            <div style="text-align: center;">
                <a href="{{ site_url }}/admin/publications/securityevent/" class="btn">View Security Logs</a>
            </div>
        </div>
        
        <div class="footer">
            <p>&copy; {{ year }} {{ SITE_NAME }}. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
