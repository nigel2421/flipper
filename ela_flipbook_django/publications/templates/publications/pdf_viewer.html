<!-- publications/templates/publications/pdf_viewer.html -->

{% extends 'publications/base.html' %}

{% block content %}
    <div class="pdf-viewer-container">
        <div class="pdf-viewer-header">
            <h2>{{ publication.title }}</h2>
            <a href="{% url 'publications:articles' %}" class="back-link">&larr; Back to Archive</a>
        </div>
        
        <!-- 
            This iframe now uses the Google Docs Viewer.
            It is highly compatible with all mobile devices and provides a clean, scrollable view.
        -->
        <iframe 
            src="https://docs.google.com/gview?url={% if '://' in publication.pdf_file.url %}{{ publication.pdf_file.url }}{% else %}{{ request.scheme }}://{{ request.get_host }}{{ publication.pdf_file.url }}{% endif %}&embedded=true" 
            class="pdf-iframe" 
            title="{{ publication.title }}">
        </iframe>
    </div>
{% endblock %}
