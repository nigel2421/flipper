{% extends 'publications/base.html' %}

{% block content %}
<style>
    .contributors-container-wrapper {
        background: #007bff;
        color: white;
        padding: 60px 20px;
    }
    .contributors-container {
        max-width: 550px;
        margin: 0 auto;
        text-align: center;
    }

    .contributors-header h1 {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 30px;
    }

    .contributors-form-container form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .contributors-form-container input,
    .contributors-form-container select,
    .contributors-form-container textarea {
        width: 100%;
        padding: 18px 15px;
        border-radius: 5px;
        border: 1px solid #ddd;
        font-size: 1rem;
        background-color: #fff;
        color: #333;
    }

    .contributors-form-container .btn {
        padding: 18px 15px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
        background-color: #6a8d7d;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: background-color 0.3s ease;
    }

    .contributors-form-container .btn:hover {
        background-color: #58796a;
    }
</style>

<div class="contributors-container-wrapper">
    <div class="container contributors-container">
        <header class="contributors-header">
            <h1>Contribute to Business Matters</h1>
        </header>

        <div class="contributors-form-container">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
