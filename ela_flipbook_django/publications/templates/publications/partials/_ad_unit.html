{% load static %}

<div class="ad-container ad-slot-{{ ad_unit.slot_name }}" style="margin: 20px auto; text-align: center; min-height: 90px;">
    {% if ad_unit %}
        <div id="{{ ad_unit.slot_name }}">
            <script>
                window.googletag = window.googletag || {cmd: []};
                googletag.cmd.push(function() {
                    googletag.defineSlot('{{ ad_unit.gam_id }}', {{ ad_unit.sizes|safe }}, '{{ ad_unit.slot_name }}').addService(googletag.pubads());
                    googletag.display('{{ ad_unit.slot_name }}');
                });
            </script>
        </div>

        {% if fallback_ad %}
            <!-- House Ad Fallback (Displayed if GAM has nothing to show) -->
            <div id="fallback-{{ ad_unit.slot_name }}" style="display: none;">
                <a href="{{ fallback_ad.link_url }}" target="_blank" rel="noopener">
                    <img src="{{ fallback_ad.image.url }}" alt="{{ fallback_ad.name }}" style="max-width: 100%; height: auto;">
                </a>
                <p style="font-size: 0.75rem; color: #999; margin: 5px 0;">Promoted</p>
            </div>
            
            <script>
                // Simple script to show House Ad if the GAM slot remains empty after a delay
                setTimeout(function() {
                    var slot = document.getElementById('{{ ad_unit.slot_name }}');
                    if (slot && slot.offsetHeight === 0) {
                        document.getElementById('fallback-{{ ad_unit.slot_name }}').style.display = 'block';
                    }
                }, 3000);
            </script>
        {% endif %}
        
    {% else %}
        <!-- No Ad Configured -->
    {% endif %}
</div>
