{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Matters</title>

    <!-- Favicon Links -->
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{% static 'publications/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <!-- Changed class to 'navbar-container' for better CSS control -->
        <div class="container navbar-container">
            <a href="{% url 'publications:home' %}" class="logo">Business Matters</a>
            
            <!-- === NEW: The Hamburger Menu Icon === -->
            <div class="hamburger" id="hamburger-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <!-- The Navigation Links -->
            <nav class="main-nav" id="main-nav">
                <a href="{% url 'publications:home' %}">Home</a>
                
                <a href="{% url 'publications:articles' %}">Articles</a>
                <a href="{% url 'publications:contact' %}">Contacts</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Messages Block -->
        {% if messages %}
            <div class="container message-container">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Main Content Block -->
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {% now "Y" %} Business Matters. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- === NEW: Simple JavaScript for Mobile Menu Toggle === -->
    <script>
        const hamburger = document.getElementById('hamburger-menu');
        const navMenu = document.getElementById('main-nav');

        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                // Toggle the 'active' class on both the hamburger and the menu
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            // Close menu when a link is clicked
            document.querySelectorAll('.main-nav a').forEach(n => n.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            }));
        }
    </script>

</body>
</html>
