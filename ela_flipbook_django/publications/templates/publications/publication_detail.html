{% extends 'publications/base.html' %}
{% load static %}

{% block title %}Viewing: {{ publication.title }}{% endblock %}

{% block extra_css %}
    <!-- dFlip CSS -->
    <link href="{% static 'publications/dflip/dflip.min.css' %}" rel="stylesheet" type="text/css">
    <style>
        .flipbook-container {
            padding: 2rem;
            max-width: 900px;
            margin: auto;
            text-align: center;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            text-decoration: none;
            color: #007bff;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h2 {
            margin-bottom: 1.5rem;
        }
        ._df_book {
            margin: 0 auto;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div class="flipbook-container">
                    <a href="{% url 'publications:home' %}" class="back-link">&larr; Back to All Publications</a>
                    <h2 class="mb-4">Viewing: {{ publication.title }}</h2>

                    <!-- dFlip.js Flipbook Container -->
                    <div class="_df_book" 
                         source="{{ publication.pdf_file.url }}" 
                         id="df_manual_book"
                         download="false">
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <!-- jQuery from a reliable CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- dFlip Configuration: This MUST be defined before loading the dflip.js script. -->
    <script>
        var DFLIP = {
            libs: "{% static 'publications/dflip/libs/' %}"
        };
    </script>
    
    <!-- dFlip JavaScript Library -->
    <script src="{% static 'publications/dflip/dflip.min.js' %}" type="text/javascript"></script>
{% endblock %}
